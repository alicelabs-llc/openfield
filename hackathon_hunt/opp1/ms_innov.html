    <title>Innovation Studio</title>
    <script>
      (function () {
        var t = localStorage.getItem('studio-theme');
        var d = document.documentElement;
        if (t === 'dark') d.className = 'dark';
        else if (t === 'hc') d.className = 'hc';
        else if (t === 'system' || !t) {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) d.className = 'dark';
        }
      })();
    </script>
    <!-- Static twin of src/components/shared/AppSplashScreen.jsx, painted before React mounts (AB#11900). -->
    <style>
      .app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 16px;
        background: #ffffff;
        color: #242424;
        font-family:
          'Segoe UI',
          'Segoe UI Web (West European)',
          -apple-system,
          BlinkMacSystemFont,
          Roboto,
          'Helvetica Neue',
          sans-serif;
      }
      .app-splash__logo {
        width: 128px;
        height: 128px;
      }
      .app-splash__track {
        display: block;
        width: 100%;
        max-width: 14rem;
        height: 4px;
        overflow: hidden;
        border-radius: 4px;
        background-color: #e6e6e6;
      }
      .app-splash__bar {
        width: 10%;
        height: 100%;
        border-radius: 4px;
        background-color: #0f6cbd;
      }
      html.dark .app-splash {
        background: #252525;
        color: #e0e0e0;
      }
      html.dark .app-splash__track {
        background-color: #333333;
      }
      html.dark .app-splash__bar {
        background-color: #479ef5;
      }
      html.hc .app-splash {
        background: #000000;
        color: #ffffff;
      }
      html.hc .app-splash__track {
        background-color: #000000;
      }
      html.hc .app-splash__bar {
        background-color: #1aebff;
      }
    </style>

  <body>
    <div id="root">
      <main class="app-splash" aria-busy="true">
        <img class="app-splash__logo" src="/favicon.svg" alt="" aria-hidden="true" />
        <div
          class="app-splash__track"
          role="progressbar"
          aria-label="Loading"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="10"
        >
          <div class="app-splash__bar"></div>
        </div>
      </main>
    </div>
