<script>
// ----------------------------------------------------  
// Run code once the entire page has loaded
// ----------------------------------------------------  
$(window).on("load", function () {

  // -------------------------------------------------
  // Change Year dynamically
  // -------------------------------------------------  
  const currentYear = new Date().getFullYear();
  $('.copyright-year').text(currentYear);
  // -------------------------------------------------
  // Change Year dynamically
  // -------------------------------------------------  

  
  // -------------------------------------------------
  // PREVENTING CONTENT FLASH ON PAGE LOAD
  // -------------------------------------------------
  $(".page-wrapper").each(function () {
    gsap.set(".page-wrapper", {
      opacity: 1
    });
  });
  
  // ----------------------------------------------------
  // Run mobile menu behavior only on 991px and below
  // ----------------------------------------------------

  function initMobileMenu() {
    var menuButton = $('.menu_button-mobile');
    var body = $('body');

    // Toggle body scroll when mobile menu opens/closes
    menuButton.on('click.mobileMenu', function () {
      if (body.css('overflow') === 'hidden') {
        body.css('overflow', 'auto');
      } else {
        body.css('overflow', 'hidden');
      }
    });

    // Close mobile menu when a nav link is clicked
    $(".nav_menu_link").not(".is-dropdown").on("click.mobileMenu", function () {
      $(".menu_button-mobile").trigger("click");
    });
  }

  function destroyMobileMenu() {
    var body = $('body');

    // Remove events
    $('.menu_button-mobile').off('.mobileMenu');
    $('.nav_menu_link').off('.mobileMenu');

    // Reset overflow just in case
    body.css('overflow', 'auto');
  }

  // Media query for 991px and below
  var mobileQuery = window.matchMedia('(max-width: 991px)');

  function handleBreakpoint(e) {
    if (e.matches) {
      // Mobile active
      initMobileMenu();
    } else {
      // Desktop active
      destroyMobileMenu();
    }
  }

  // Run on load
  handleBreakpoint(mobileQuery);

  // Run on resize
  mobileQuery.addEventListener('change', handleBreakpoint);

  
  // Select the menu element (make sure it has the id "menu")
  var menu = $('#menu');

  // Select the brand image inside the navigation component
  var brandImage = $('.nav_component .nav_logo');

  // Initial menu height using a CSS custom property
  var initialHeight = '6.5rem';

  // Menu height when the page is scrolled
  var scrolledHeight = '4.5rem';

  // Initial brand image width
  var initialWidth = '8.125rem';

  // Brand image width when the page is scrolled
  var scrolledWidth = '7rem';

  function applyScrollEffects() {
    // Apply scroll behavior only on desktop (991px and above)
    if ($(window).width() >= 991) {
      $(window).scroll(function () {
        // Check if the user has scrolled more than 16px
        if ($(window).scrollTop() > 16) {
          menu.css({
            height: scrolledHeight,
            'background-color': 'var(--_primitive-colors---neutral--n950)'
          });

          brandImage.css({
            width: scrolledWidth
          });
        } else {
          menu.css({
            height: initialHeight,
            'background-color': 'transparent'
          });

          brandImage.css({
            width: initialWidth
          });
        }
      });
    }
  }

  // Run the function on page load
  applyScrollEffects();

  // Re-check behavior on window resize
  $(window).resize(applyScrollEffects);

  // End: menu resize on scroll
  

  // -------------------------------------------------
  // LENIS SMOOTH SCROLL
  // -------------------------------------------------
  let lenis;

  // Run only outside Webflow Designer/Editor mode
  if (Webflow.env("editor") === undefined) {
    // Initialize Lenis with base settings
    lenis = new Lenis({
      lerp: 0.1,               // Lower values = smoother, slower scroll
      duration: 1.4,           // Duration of the scroll animation
      wheelMultiplier: 1.3,    // Scroll wheel sensitivity
      gestureOrientation: "vertical", // Enable vertical scroll
      normalizeWheel: false,   // Disable wheel normalization
      smoothTouch: false       // Disable smooth scroll on touch devices
    });

    // Request Animation Frame (RAF) loop
    function raf(time) {
      lenis.raf(time);         // Update Lenis on each frame
      requestAnimationFrame(raf);
    }

    // Start the RAF loop
    requestAnimationFrame(raf);
  }
  // -------------------------------------------------
  // END LENIS SMOOTH SCROLL
  // ------------------------------------------------- 
  
});

//===== Rotating Text =====//
function initRotatingText() {
  document.querySelectorAll('[data-rotating-title]').forEach((heading) => {

    const stepDuration = parseFloat(heading.getAttribute('data-step-duration') || '1.75');

    SplitText.create(heading, {
      type: 'lines',
      mask: 'lines',
      autoSplit: true,
      linesClass: 'rotating-line',
      onSplit(instance) {
        const rotatingSpan = heading.querySelector('[data-rotating-words]');
        if (!rotatingSpan) return;

        const rawWords = rotatingSpan.getAttribute('data-rotating-words') || '';
        const words = rawWords
          .split(',')
          .map((w) => w.trim())
          .filter(Boolean);

        if (!words.length) return;

        // Build inner wrapper with stacked words
        const wrapper = document.createElement('span');
        wrapper.className = 'rotating-text__inner';

        const wordEls = words.map((word) => {
          const el = document.createElement('span');
          el.className = 'rotating-text__word';
          el.textContent = word;
          wrapper.appendChild(el);
          return el;
        });

        // Replace the original content of the highlight span
        rotatingSpan.textContent = '';
        rotatingSpan.appendChild(wrapper);

        requestAnimationFrame(() => {
          
          // Define duration of your in + out movement
          const inDuration = 0.75;
          const outDuration = 0.6;

          // Initial state: everyone hidden below
          gsap.set(wordEls, { yPercent: 150, autoAlpha: 0 });

          // Show first word immediately
          let activeIndex = 0;
          const firstWord = wordEls[activeIndex];
          gsap.set(firstWord, { yPercent: 0, autoAlpha: 1 });

          // Set initial width to first word
          const firstWidth = firstWord.getBoundingClientRect().width;
          wrapper.style.width = firstWidth + 'px';

          function showNext() {
            const nextIndex = (activeIndex + 1) % wordEls.length;
            const prev = wordEls[activeIndex];
            const current = wordEls[nextIndex];

            const targetWidth = current.getBoundingClientRect().width;

            // Animate wrapper width to match new word
            gsap.to(wrapper, {
              width: targetWidth,
              duration: inDuration,
              ease: 'power4.inOut'
            });

            // Move old word out
            if (prev && prev !== current) {
              gsap.to(prev, {
                yPercent: -150,
                autoAlpha: 0,
                duration: outDuration,
                ease: 'power4.inOut'
              });
            }

            // Reveal new word
            gsap.fromTo(
              current,
              { yPercent: 150, autoAlpha: 0 },
              {
                yPercent: 0,
                autoAlpha: 1,
                duration: inDuration,
                ease: 'power4.inOut'
              }
            );

            activeIndex = nextIndex;

            gsap.delayedCall(stepDuration, showNext);
          }

          // First word is already visible, start rotating after a full step
          if (wordEls.length > 1) {
            gsap.delayedCall(stepDuration, showNext);
          }
        });
      }
    });
  });
}

// Initialize Rotating Text
document.addEventListener("DOMContentLoaded", function () {
  initRotatingText();
});
