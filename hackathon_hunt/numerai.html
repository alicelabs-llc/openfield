    <script>
      document.documentElement.classList.add('booting')
      try {
        if (localStorage.getItem('darkmode') === 'true') {
          document.documentElement.classList.add('booting-dark')
        }
        if (localStorage.getItem('dashboardNavMinimized') === 'true') {
          document.documentElement.classList.add('booting-minimized')
        }
      } catch (e) {}
      if (location.hostname.indexOf('signals') === 0 || location.port === '8081') {
        document.documentElement.classList.add('booting-signals')
      } else if (
        location.hostname.indexOf('crypto') === 0 ||
        location.port === '8082'
      ) {
        document.documentElement.classList.add('booting-crypto')
      }
      var soloRoutes = ['/login', '/signup', '/reset', '/reset-password/u/']
      for (var i = 0; i < soloRoutes.length; i++) {
        if (location.pathname.indexOf(soloRoutes[i]) !== -1) {
          document.documentElement.classList.add('booting-solo')
          break
        }
      }
      // Account profiles are /~account; model profiles are the /:username
      // catch-all, so anything whose first segment is not a top-level path in
      // src/lib/router.ts (or a /:round number) is a model profile.
      var appRoutes = [
        'account', 'confirm', 'dashboard', 'data', 'earn', 'leaderboard',
        'legal', 'login', 'mcp', 'meta-model', 'models', 'news-feed',
        'onboarding', 'privacy', 'report-issue', 'reset', 'reset-email',
        'reset-password', 'round', 'scores', 'season', 'signup', 'sso',
        'staking', 'submissions', 'terms', 'tournament', 'tutorial',
        'unsubscribe', 'verify', 'verify-ip', 'wallet',
      ]
      var firstSegment = location.pathname.split('/')[1] || ''
      if (
        firstSegment.charAt(0) === '~' ||
        (firstSegment &&
          !/^\d+$/.test(firstSegment) &&
          appRoutes.indexOf(firstSegment) === -1)
      ) {
        document.documentElement.classList.add('booting-profile')
      }
      window.addEventListener(
        'error',
        function (e) {
          var t = e && e.target
          var loadFailed = t && t.tagName === 'SCRIPT' && t.type === 'module'
          var evalThrew =
            e &&
            e.filename &&
            e.filename.indexOf(location.origin + '/assets/') === 0
          if (loadFailed || evalThrew) {
            document.documentElement.classList.remove('booting', 'booting-dark')
          }
        },
        true,
      )
    </script>
