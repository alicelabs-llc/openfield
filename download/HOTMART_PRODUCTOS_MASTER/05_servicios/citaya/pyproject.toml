[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citaya"
version = "1.0.0"
description = "Sistema de reservas/citas self-hosted para clínicas, peluquerías, consultorios. Calendario, recordatorios, multi-profesional."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Eddy Flores", email = "eddyflores100@gmail.com" }]
keywords = ["booking", "appointments", "reservas", "citas", "calendar", "scheduling"]
dependencies = [
    "fastapi>=0.115", "uvicorn[standard]>=0.34", "click>=8.1", "rich>=13.9",
    "pydantic>=2.10", "pydantic-settings>=2.7", "httpx[http2]>=0.28",
    "jinja2>=3.1", "python-multipart>=0.0.20", "diskcache>=5.6",
    "tenacity>=9.0", "apscheduler>=3.10", "icalendar>=6.1",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.25"]

[project.scripts]
citaya = "citaya.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
